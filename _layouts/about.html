---
layout: default
---
<div class="about-page">
  <h1 class="page-heading post-list-heading">{{ page.title }}</h1>

  <div class="about-content">
    {%- if page.image -%}
      <div class="about-image">
        {%- assign img_path = page.image -%}
        {%- unless img_path contains "/" -%}
          {%- assign img_path = "/assets/uploads/" | append: img_path -%}
        {%- endunless -%}
        <img src="{{ img_path | relative_url }}" alt="Andju Ormeloh – Porträt in natürlicher Umgebung" loading="lazy">
      </div>
    {%- endif -%}

    <div class="about-main">
      <div class="about-body">
        {{ content }}
      </div>
    </div>
  </div>
</div>
